name: ci pipeline

on:
  push:
    paths:
      - 'cicd/task-1/**'
pull_request:
    paths:
      - 'cicd/task-1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install dependencies
        working-directory: cicd/task-1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        working-directory: cicd/task-1
        run: pytest -v



