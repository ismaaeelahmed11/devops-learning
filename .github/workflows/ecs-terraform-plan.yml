name: ECS Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ecs-project/terraform/**'
      - '.github/workflows/ecs-terraform-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.11.0

jobs:
  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecs-project/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform Init without remote backend
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Manual Terraform Plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ecs-project/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS planning credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color